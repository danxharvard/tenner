# m.tenner.stream: Tenner's phone view on a computer. Any page address gets a small page that shows the same page of
# tenner.stream in a phone-sized window (so the phone layout, sign-in and Watchlist are the real ones). Phones are sent
# straight on to tenner.stream. Deployed by .github/workflows/update.yml.
name = "tenner-m"
main = "m.js"
compatibility_date = "2026-09-01"
workers_dev = false

[[routes]]
pattern = "m.tenner.stream"
custom_domain = true
