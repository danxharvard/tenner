name = "tenner-beta"
main = "beta.js"
compatibility_date = "2026-09-01"
workers_dev = false

[assets]
directory = "../site"
html_handling = "auto-trailing-slash"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/", "/index.html"]

[[routes]]
pattern = "beta.tenner.stream"
custom_domain = true
