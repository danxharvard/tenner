name: Deploy Tenner beta notice

on:
  push:
    branches: [main, codex/beta-redesign]
    paths:
      - 'site-worker/beta.js'
      - 'site-worker/beta.toml'
      - '.github/workflows/beta.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Deploy the beta access notice
        working-directory: site-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error title=Beta not deployed::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings > Secrets and variables > Actions."
            exit 1
          fi
          npx --yes wrangler@4 deploy -c beta.toml
          echo "### Beta access notice is live: https://beta.tenner.stream/" >> "$GITHUB_STEP_SUMMARY"
