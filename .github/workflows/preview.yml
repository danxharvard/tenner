# A preview of a branch's site, before it's merged: the site/ folder from the branch, with the live charts and data
# copied in, on its own Worker (tenner-preview) at its workers.dev address. It never touches tenner.stream or the live
# Worker. Runs on every push to a claude/ branch that changes the site, or by hand from the Actions tab.
name: Preview a branch

on:
  push:
    branches: ['claude/**']
    paths: ['site/**', 'site-worker/**', '.github/workflows/preview.yml']
  workflow_dispatch:

concurrency:
  group: preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # the live data, read from the live Worker's workers.dev address (tenner.stream turns automated requests away)
      - name: Copy in the live charts and data
        working-directory: site
        run: |
          for f in trending browse browse-more week new cinema titles trail featured spotlight prices; do
            curl -fsS --retry 3 "https://tenner-site.danseacroft.workers.dev/data/$f.json" -o "data/$f.json.new" && mv "data/$f.json.new" "data/$f.json" || echo "::warning::Kept the sample data/$f.json"
          done

      - name: Deploy the preview
        working-directory: site-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          sed -i '/^\[\[routes\]\]/,+2d; s/^name = "tenner-site"/name = "tenner-preview"/' wrangler.toml
          grep -q '^name = "tenner-preview"' wrangler.toml && ! grep -q 'routes' wrangler.toml
          npx --yes wrangler@4 deploy
          echo "### Preview: https://tenner-preview.danseacroft.workers.dev/" >> "$GITHUB_STEP_SUMMARY"
