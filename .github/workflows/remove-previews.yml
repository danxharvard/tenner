# One-off (the owner asked on 19 Nov 2026 for the preview versions to go): deletes the branch preview Worker
# (tenner-preview, at its workers.dev address) and the beta notice Worker (tenner-beta, on beta.tenner.stream).
# It never touches tenner-site, tenner-www, tenner-m, tenner-tv or the search Worker. Removed again once it has run.
name: Remove preview versions

on:
  push:
    branches: [main]
    paths: ['.github/workflows/remove-previews.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remove:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete the preview Workers
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          api() { curl -sS -X "$1" -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/$2"; }
          for w in tenner-preview tenner-beta; do
            case "$w" in tenner-preview|tenner-beta) ;; *) exit 1 ;; esac
            # its custom domains first (beta.tenner.stream), then the Worker itself
            for id in $(api GET "workers/domains?service=$w" | jq -r '.result[]?.id'); do
              api DELETE "workers/domains/$id" | jq -c '{success, errors}'
            done
            out=$(api DELETE "workers/scripts/$w?force=true")
            echo "$w: $(echo "$out" | jq -c '{success, errors}')"
            if echo "$out" | jq -e '.success' >/dev/null; then echo "- Deleted $w" >> "$GITHUB_STEP_SUMMARY"
            elif echo "$out" | jq -e '.errors[]? | select(.code == 10007)' >/dev/null; then echo "- $w was already gone" >> "$GITHUB_STEP_SUMMARY"
            else echo "::error::Couldn't delete $w"; exit 1; fi
          done
