name: Audit (temporary)
on:
  push:
    branches: [claude/project-thread-s8dvxa]
    paths: ['.github/workflows/zz-audit.yml']
permissions: { contents: read }
jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - run: |
          SA='Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1'
          echo "== 403 body"; curl -s -D - https://tenner.stream/ | grep -iE '^(cf-mitigated|server|HTTP)|<title>' | head
          echo "== safari UA"; curl -s -o /dev/null -w '%{http_code}\n' -A "$SA" https://tenner.stream/
          echo "== imessage UA"; curl -s -o /dev/null -w '%{http_code}\n' -A 'facebookexternalhit/1.1 Facebot Twitterbot/1.0' https://tenner.stream/t/t1399/
          echo "== whatsapp UA"; curl -s -o /dev/null -w '%{http_code}\n' -A 'WhatsApp/2.23.20.0' https://tenner.stream/t/t1399/
          W=https://tenner-site.danseacroft.workers.dev
          for p in / /index.html /about.html /about /browse.html /people.html /data/trending.json /nope.html /t/t1399/ /t/t1399 /manifest.webmanifest /?t=t1399; do
            echo "== $p"; curl -s -o /dev/null -D - -m 20 -w 'time %{time_total}s size %{size_download}\n' "$W$p" | grep -iE '^(HTTP|location|cache-control|content-type|time)'
          done
          echo "== age"; curl -s "$W/data/trending.json?v=$(date +%s)" | jq -r .generatedAt
          echo "== new"; curl -s "$W/data/new.json" | jq -c '{generatedAt, error, n: (.items|length)}'
          echo "== history"; curl -s "$W/data/history.json" | jq -c '{h: (.hours|keys), d: (.days|keys)}'
          for f in trending titles browse browse-more new week cinema prices history trail; do echo "$f $(curl -s -o /dev/null -w '%{size_download}' $W/data/$f.json)"; done
          echo "== tv"; curl -s -o /dev/null -w '%{http_code}\n' -A "$SA" https://tv.tenner.stream/
