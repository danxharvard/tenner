name: Update and deploy

on:
  schedule:
    # GitHub drops many scheduled runs when it's busy (in practice "hourly" ran every five to seven hours), so it's asked
    # three times an hour; a run that finds the live chart under 40 minutes old stops straight away, so it still builds hourly
    - cron: '7,27,47 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write   # only for the keepalive step below

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # a normal run takes about a minute; never let a stuck one hold the queue
    outputs:
      go: ${{ steps.gate.outputs.go }}
    steps:
      # only the timetable's spare tries are skipped: a push or a run by hand (or by the watchdog) always builds, and a chart
      # that couldn't be read, or was kept from an earlier hour because TMDB had a bad moment, is tried again
      - name: Is the live chart already fresh?
        id: gate
        run: |
          go=yes
          if [ "${{ github.event_name }}" = schedule ]; then
            mins=$(curl -s -m 20 "https://tenner.stream/data/trending.json?v=$(date +%s)" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(Math.round((Date.now()-Date.parse(JSON.parse(s).generatedAt))/60000))}catch{console.log(99999)}})')
            if [ "$mins" -lt 40 ] 2>/dev/null; then go=no; echo "The live chart is $mins minutes old, so this try isn't needed"; fi
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        if: steps.gate.outputs.go == 'yes'

      - uses: actions/setup-node@v5
        if: steps.gate.outputs.go == 'yes'
        with:
          node-version: 22

      - id: pages
        if: steps.gate.outputs.go == 'yes'
        uses: actions/configure-pages@v5

      - name: Fetch latest charts
        if: steps.gate.outputs.go == 'yes'
        run: node scripts/fetch-data.mjs
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          WATCHMODE_API_KEY: ${{ secrets.WATCHMODE_API_KEY }}
          SITE_URL: https://tenner.stream/

      - uses: actions/upload-pages-artifact@v4
        if: steps.gate.outputs.go == 'yes'
        with:
          path: site

      # The live site is served by Cloudflare (site-worker/), as GitHub Pages kept tenner.stream tied to the old, lost
      # account. Tried first with tenner.stream; if the domain can't be connected yet (e.g. its old DNS records are still
      # there), the site still goes up on its workers.dev address and the run says what to do. www.tenner.stream is a
      # tiny Worker that sends visitors on to tenner.stream.
      - name: Deploy to Cloudflare, at tenner.stream
        if: steps.gate.outputs.go == 'yes'
        working-directory: site-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "::error title=Site not deployed::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings > Secrets and variables > Actions."; exit 1; fi
          if ! npx --yes wrangler@4 deploy; then
            sed -i '/^\[\[routes\]\]/,+2d' wrangler.toml
            npx --yes wrangler@4 deploy
            echo "::warning title=Connect tenner.stream::The site is live on its workers.dev address only. In Cloudflare > tenner.stream > DNS, delete the A records for tenner.stream (they point at GitHub), then run this again."
          fi
          npx --yes wrangler@4 deploy -c www.toml || echo "::warning title=Connect www.tenner.stream::In Cloudflare > tenner.stream > DNS, delete the www CNAME record (it points at GitHub), then run this again."

      # GitHub pauses scheduled workflows after 60 days without a commit. Re-enabling it every run keeps the hourly
      # schedule alive indefinitely, with no commits and nobody needing to touch the repo.
      - name: Keep the hourly schedule alive
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable"

  deploy:
    needs: build
    if: needs.build.outputs.go == 'yes'
    # only the deploys queue up (one at a time, the newest waiting): a spare scheduled try that turns out not to be needed
    # never takes the place of a push that's waiting to go live
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
