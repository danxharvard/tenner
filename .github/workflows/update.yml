name: Update and deploy

on:
  schedule:
    # GitHub drops many scheduled runs when it's busy (in practice "hourly" ran every five to seven hours), so it's asked
    # three times an hour; a run that finds the live chart under 40 minutes old stops straight away, so it still builds hourly
    - cron: '7,27,47 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # only for the keepalive step below

# The live site's own Cloudflare address. tenner.stream itself sits behind Cloudflare's bot check, which turns away
# requests from GitHub's servers (people and link previews are let through), so the jobs read the live copy from here.
env:
  LIVE: https://tenner-site.danseacroft.workers.dev

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # a normal run takes about a minute; never let a stuck one hold the queue
    outputs:
      go: ${{ steps.gate.outputs.go }}
    steps:
      # only the timetable's spare tries are skipped: a push or a run by hand (or by the watchdog) always builds, and a chart
      # that couldn't be read, or was kept from an earlier hour because TMDB had a bad moment, is tried again
      - name: Is the live chart already fresh?
        id: gate
        run: |
          go=yes
          if [ "${{ github.event_name }}" = schedule ]; then
            mins=$(curl -s -m 20 "$LIVE/data/trending.json?v=$(date +%s)" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(Math.round((Date.now()-Date.parse(JSON.parse(s).generatedAt))/60000))}catch{console.log(99999)}})')
            if [ "$mins" -lt 40 ] 2>/dev/null; then go=no; echo "The live chart is $mins minutes old, so this try isn't needed"; fi
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        if: steps.gate.outputs.go == 'yes'
        with:
          fetch-depth: 0   # the whole history, for the Update centre's list below

      - uses: actions/setup-node@v5
        if: steps.gate.outputs.go == 'yes'
        with:
          node-version: 22

      # the Update centre (updates.html): any version in the history that isn't in site/updates.json yet is added from its
      # commits, so each release lists itself; never stops the build
      - name: Add new releases to the Update centre
        if: steps.gate.outputs.go == 'yes'
        continue-on-error: true
        run: node scripts/updates.mjs

      - name: Fetch latest charts
        if: steps.gate.outputs.go == 'yes'
        run: node scripts/fetch-data.mjs
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          WATCHMODE_API_KEY: ${{ secrets.WATCHMODE_API_KEY }}
          SITE_URL: ${{ env.LIVE }}

      # the scripts and styles go up minified (about a third smaller once compressed, so pages draw sooner); the copies in
      # git stay readable. esbuild writes nothing if anything fails, so the readable copies go up instead and the site
      # still deploys. The service worker and the QR code library (its licence header, and only Settings loads it) are left.
      - name: Shrink scripts and styles
        if: steps.gate.outputs.go == 'yes'
        continue-on-error: true
        working-directory: site
        run: npx --yes esbuild@0.24.0 $(ls *.js *.css | grep -vx 'sw.js\|qrcode.js') --minify --charset=utf8 --outdir=. --allow-overwrite --log-level=warning

      # the built site (with this hour's data and title pages) is handed to the deploy job below
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.go == 'yes'
        with:
          name: site
          path: site
          retention-days: 1
          include-hidden-files: false

      # GitHub pauses scheduled workflows after 60 days without a commit, and a moved repository can sit with its
      # timetable not yet running. Re-enabling it on every run (a push or a run by hand too) keeps the schedule alive.
      - name: Keep the hourly schedule alive
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable"

  deploy:
    needs: build
    if: needs.build.outputs.go == 'yes'
    # only the deploys queue up (one at a time, the newest waiting): a spare scheduled try that turns out not to be needed
    # never takes the place of a push that's waiting to go live, and an older build can never go live after a newer one
    concurrency:
      group: site
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: site-worker
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      # The live site is served by Cloudflare (site-worker/), as GitHub Pages kept tenner.stream tied to the old, lost
      # account. Tried first with tenner.stream; if the domain can't be connected yet (e.g. its old DNS records are still
      # there), the site still goes up on its workers.dev address and the run says what to do. www.tenner.stream is a
      # tiny Worker that sends visitors on to tenner.stream.
      - name: Deploy to Cloudflare, at tenner.stream
        working-directory: site-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "::error title=Site not deployed::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings > Secrets and variables > Actions."; exit 1; fi
          if ! npx --yes wrangler@4 deploy; then
            sed -i '/^\[\[routes\]\]/,+2d' wrangler.toml
            npx --yes wrangler@4 deploy
            echo "::warning title=Connect tenner.stream::The site is live on its workers.dev address only. In Cloudflare > tenner.stream > DNS, delete the A records for tenner.stream (they point at GitHub), then run this again."
          fi
          npx --yes wrangler@4 deploy -c www.toml || echo "::warning title=Connect www.tenner.stream::In Cloudflare > tenner.stream > DNS, delete the www CNAME record (it points at GitHub), then run this again."
